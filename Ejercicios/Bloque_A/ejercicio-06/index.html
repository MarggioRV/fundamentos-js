<html lang="en">
  <head>

    <!-- Ir descomentando -->
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="../estilos.css" />
    <title>Ejercicio_6</title>

  <body>
    <main>
      <section class="calculadora">
        <span class="ejer-label">BLOQUE_A - EJERCICIO_06</span>
        <h1>Impresora_números</h1>
        <br />
        <form id="number-form">
          <label for="number-input">Introduce un número</label>
          <input type="number" id="entrando" name="numero" step="1" required />
          <section class="area_botones">
            <img src="../images/Garfield.gif" alt="" draggable="false"; />
            <button type="button" id="enviar">Imprimir</button>
            <button type="reset" id="reset">Resetear</button>
            <img src="../images/Garfield.gif" alt="" draggable="false"; />
          </section>
        </form>
        <section id="rpta" class="resultadoCont" role="status" aria-live="polite">
          RPTA
        </section>
      </section>
    </main>
  </body>
